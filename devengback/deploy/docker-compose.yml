version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: template-ai-postgres
    restart: always
    environment:
      POSTGRES_DB: deviation_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - template-ai-network
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deviation_engine"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: template-ai-qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - template-ai-network
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  backend:
    build:
      context: ../
      dockerfile: ./deploy/Dockerfile.backend
    container_name: template-ai-backend
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - template-ai-network
    volumes:
      - backend_logs:/app/logs

  # Nginx for SSL termination and reverse proxy
  nginx:
    image: nginx:latest
    container_name: template-ai-nginx
    restart: always
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

      # - /etc/letsencrypt/live/ec2-18-199-142-122.eu-central-1.compute.amazonaws.com/fullchain.pem:/etc/nginx/ssl/cert.pem:ro
      # - /etc/letsencrypt/live/ec2-18-199-142-122.eu-central-1.compute.amazonaws.com/privkey.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - backend
    networks:
      - template-ai-network
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  backend_logs:
  qdrant_data:

networks:
  template-ai-network:
    driver: bridge 